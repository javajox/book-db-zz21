plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.vaadin'
}

group = 'org.wintermutecore'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.vaadin.com/vaadin-addons' }
}

dependencies {
    implementation 'com.vaadin:vaadin-spring-boot-starter'
    // Persistence versions are pinned by the Spring Boot 4.1.0 BOM.
    implementation 'org.springframework:spring-jdbc'
    implementation 'org.flywaydb:flyway-core'
    // A compile dependency since stage 5: the data-source configuration sets foreign keys, WAL,
    // and the busy timeout through SQLiteConfig so the driver applies them to every connection.
    implementation 'org.xerial:sqlite-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly 'com.vaadin:vaadin-dev'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

dependencyManagement {
    imports {
        mavenBom "com.vaadin:vaadin-bom:$vaadinVersion"
    }
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    // Image fixtures encode real PNG/JPEG bytes through ImageIO, which must not try to reach a display.
    systemProperty 'java.awt.headless', 'true'
}

// A green build that silently ran no tests is not verification. Gradle reports `test NO-SOURCE`
// when it discovers nothing, and that reads exactly like success in CI output. This task reads the
// JUnit XML results and fails when the executed count is zero, so test discovery breaking is
// always a build failure rather than a quiet one.
tasks.register('verifyTestsExecuted') {
    description = 'Fails the build when the test task executed no tests at all.'
    group = 'verification'
    dependsOn tasks.named('test')

    // Deliberately not declared as a task input. The whole point of this task is to run when the
    // results directory is missing or empty, which is exactly when an input declaration would fail
    // the build with Gradle's own "input file does not exist" error instead of the diagnostic below.
    def resultsDirectory = layout.buildDirectory.dir('test-results/test')

    doLast {
        def directory = resultsDirectory.get().asFile
        def reports = directory.listFiles({ file ->
            file.name.startsWith('TEST-') && file.name.endsWith('.xml')
        } as FileFilter) ?: []

        def executed = reports.sum { report ->
            (new groovy.xml.XmlSlurper().parse(report).@tests).toString() as int
        } ?: 0

        if (executed == 0) {
            throw new GradleException(
                    "No tests were executed. Gradle found ${reports.size()} JUnit result files in " +
                    "${directory}. Check that test classes are under src/test/java and that the " +
                    'JUnit Platform is configured; a `test NO-SOURCE` build verifies nothing.')
        }
        logger.lifecycle("Verified ${executed} executed tests across ${reports.size()} test classes.")
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyTestsExecuted')
}

tasks.named('bootRun') {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

// The release is the executable Spring Boot JAR, so that is the only JAR the build produces.
//
// Gradle's `jar` task would otherwise also write book-db-zz21-<version>-plain.jar next to it: the
// application's own classes with an empty manifest, no dependencies, and no Main-Class. It cannot
// run, nothing in this project consumes it as a library, and its only realistic effect is that
// someone picks it out of build/libs/ and deploys seven megabytes that do nothing. Leaving one
// artifact in the directory is a better answer than documenting which of two to choose.
tasks.named('jar') {
    enabled = false
}
