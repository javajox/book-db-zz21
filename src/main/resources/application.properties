# Application defaults.
#
# The bookdb.* settings are not listed here on purpose: their defaults live in DatabaseProperties,
# so there is one place that defines them rather than two that can disagree. Override them from a
# configuration file, environment variables, or command-line arguments at deployment time.

# Spring Boot DevTools ships an auto-configuration that keeps an in-memory development database
# alive across restarts. Its condition class references
# org.springframework.boot.jdbc.autoconfigure.DataSourceProperties, which lives in Spring Boot 4's
# spring-boot-jdbc module. This project deliberately uses plain spring-jdbc and configures its own
# SQLite data source, so that module is absent and the condition cannot even be evaluated: running
# from an IDE or through bootRun fails during context initialization.
#
# Excluding it keeps the useful half of DevTools - restart on classpath change - and discards a
# feature that is meaningless here anyway, since the database is a file on disk rather than an
# in-memory one that needs rescuing between restarts.
#
# This line is harmless in production: DevTools is a developmentOnly dependency and absent from the
# executable JAR, and Spring Boot ignores an exclusion naming a class that is not on the classpath.
spring.autoconfigure.exclude=org.springframework.boot.devtools.autoconfigure.DevToolsDataSourceAutoConfiguration
